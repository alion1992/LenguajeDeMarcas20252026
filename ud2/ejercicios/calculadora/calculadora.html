<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>

    <style>

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f2f4f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        .calculadora{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
            width:260px;
        }

        .pantalla{
            width:100%;
            height:50px;
            margin-bottom:15px;
            text-align:right;
            font-size:1.8rem;
            padding:5px;
        }

        .botones{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
        }

        button{
            height:50px;
            font-size:1.2rem;
            border:none;
            border-radius:8px;
            cursor:pointer;
            background:#e6e9ef;
            transition:0.2s;
        }

        button:hover{
            background:#d2d7e0;
        }

        .operador{
            background:#ffd166;
        }

        .igual{
            background:#06d6a0;
            color:white;
        }

        .clear{
            background:#ef476f;
            color:white;
        }

        h1{
          text-align: center;  
        }

    </style>
</head>
<body>


<div class="calculadora">
    <h1>CALCULADORA DAW1</h1>

    <input class="pantalla" type="text" readonly>

    <div class="botones">

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button class="operador">/</button>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button class="operador">*</button>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button class="operador">-</button>

        <button>0</button>
        <button class="clear">C</button>
        <button class="igual">=</button>
        <button class="operador">+</button>

    </div>

</div>

</body>
</html>

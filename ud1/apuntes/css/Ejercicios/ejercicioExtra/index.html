<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio CSS – Formularios</title>

    <!-- Fuente para que el alumno la cambie en su CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Ejercicio de Formularios para Practicar CSS</h1>

    <!-- FORMULARIO 1 -->
    <section class="formulario" id="form-1">
        <h2>Registro de Usuario</h2>

        <form>
            <label for="nombre-registro">Nombre:</label>
            <input type="text" id="nombre-registro" name="nombre">

            <label for="email-registro">Email (obligatorio modificar por ID):</label>
            <input type="email" id="email-registro" name="email">

            <label for="pass-registro">Contraseña:</label>
            <input type="password" id="pass-registro" name="pass">

            <div class="botonera">
                <button type="submit" class="btn-primary-action">Registrarse</button>
                <button type="reset" class="btn-secondary-action">Limpiar</button>
            </div>
        </form>
    </section>

    <!-- FORMULARIO 2 -->
    <section class="formulario" id="form-2">
        <h2>Formulario de Contacto</h2>

        <form>
            <label for="contact-nombre">Nombre:</label>
            <input type="text" id="contact-nombre">

            <label for="contact-mensaje">Mensaje:</label>
            <textarea id="contact-mensaje"></textarea>

            <div class="botonera">
                <button type="submit" class="btn-primary-action">Enviar</button>
                <button type="button" class="btn-delete-action">Cancelar</button>
            </div>
        </form>
    </section>

    <!-- FORMULARIO 3 -->
    <section class="formulario" id="form-3">
        <h2>Encuesta de Satisfacción</h2>

        <form>
            <label for="satis-nombre">Nombre:</label>
            <input type="text" id="satis-nombre">

            <label for="satis-valoracion">Valoración (1 a 5):</label>
            <input type="number" id="satis-valoracion" min="1" max="5">

            <label for="satis-comentario">Comentario:</label>
            <textarea id="satis-comentario"></textarea>

            <div class="botonera">
                <button type="submit" class="btn-primary-action">Enviar Encuesta</button>
                <button type="reset" class="btn-secondary-action">Restablecer</button>
            </div>
        </form>
    </section>

</body>
</html>

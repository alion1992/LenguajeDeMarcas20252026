<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario NFL</title>
</head>
<body>

    <header id="cabecera">
        <h1 class="titulo-principal">Draft NFL 2025</h1>
        <nav class="menu">
            <a href="#" class="link">Inicio</a>
            <a href="#" class="link">Equipos</a>
            <a href="#" class="link destacado">Jugadores</a>
            <a href="#" class="link">Contactos</a>
        </nav>
    </header>

    <main>

        
        <section id="registro-jugador">
            <h2 class="subtitulo">Registrar Nuevo Jugador</h2>

            <form id="form-jugador">

                <label for="nombre">Nombre del jugador:</label>
                <input type="text" id="nombre" class="input-text" placeholder="Ej: Patrick Mahomes">

                <label for="posicion">Posición:</label>
                <select id="posicion" class="select-posicion">
                    <option value="">Selecciona...</option>
                    <option value="QB">Quarterback</option>
                    <option value="WR">Wide Receiver</option>
                    <option value="RB">Running Back</option>
                    <option value="LB">Linebacker</option>
                </select>

                <p>Selecciona tu conferencia favorita:</p>
                <label><input type="radio" name="conferencia" value="AFC" class="input-radio"> AFC</label>
                <label><input type="radio" name="conferencia" value="NFC" class="input-radio"> NFC</label>

                <p>Equipos favoritos:</p>
                <label><input type="checkbox" class="equipo" value="Chiefs"> Kansas City Chiefs</label>
                <label><input type="checkbox" class="equipo" value="49ers"> San Francisco 49ers</label>
                <label><input type="checkbox" class="equipo" value="Cowboys"> Dallas Cowboys</label>

                <label for="comentarios">Comentarios sobre el jugador:</label>
                <textarea id="comentarios" class="area-texto" rows="4"></textarea>

                <button type="submit" id="btn-registrar" class="btn">Registrar jugador</button>
                <button type="reset" class="btn secundario">Limpiar</button>

            </form>
        </section>

        
        <section id="busqueda-jugadores">
            <h2 class="subtitulo">Buscar Jugadores</h2>

            <input type="text" id="buscar" placeholder="Buscar por nombre…" class="input-busqueda">
            <button id="btn-buscar" class="btn">Buscar</button>

            <p class="mensaje" data-info="oculto">No se han encontrado resultados.</p>
        </section>

    </main>

    <footer id="pie">
        <p>&copy; 2025 Draft NFL – DAW/DAM Lenguaje de Marcas</p>
    </footer>

</body>
</html>
